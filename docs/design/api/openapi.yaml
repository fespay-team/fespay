      properties:
        export_id:
          $ref: '#/components/schemas/ResourceId'
        event_id:
          $ref: '#/components/schemas/ResourceId'
        creator_account_id:
          $ref: '#/components/schemas/ResourceId'
        dataset:
          type: string
          enum:
          - TRANSACTIONS
          - SALES
          - ORDERS
          - CASH
        filter:
          $ref: '#/components/schemas/ReportFilter'
        status:
          type: string
          enum:
          - QUEUED
          - GENERATING
          - READY
          - FAILED
          - EXPIRED
        snapshot_id:
          $ref: '#/components/schemas/ResourceId'
        row_count:
          $ref: '#/components/schemas/AggregateCount'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ExportPart'
          minItems: 1
          maxItems: 10000
        expires_at:
          $ref: '#/components/schemas/UtcDateTime'
        failure_code:
          type: string
          minLength: 1
          maxLength: 100
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
      allOf:
      - if:
          properties:
            status:
              const: READY
          required:
          - status
        then:
          properties:
            row_count: {}
            parts: {}
            expires_at: {}
          required:
          - row_count
          - parts
          - expires_at
      - if:
          properties:
            status:
              const: FAILED
          required:
          - status
        then:
          properties:
            failure_code: {}
          required:
          - failure_code
      - if:
          properties:
            status:
              const: QUEUED
          required:
          - status
        then:
          not:
            required:
            - parts
            properties:
              parts: {}
      - if:
          properties:
            status:
              const: GENERATING
          required:
          - status
        then:
          not:
            required:
            - parts
            properties:
              parts: {}
      - if:
          properties:
            status:
              const: FAILED
          required:
          - status
        then:
          not:
            required:
            - parts
            properties:
              parts: {}
      - if:
          properties:
            status:
              const: EXPIRED
          required:
          - status
        then:
          not:
            required:
            - parts
            properties:
              parts: {}
