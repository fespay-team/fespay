openapi: 3.1.0
info:
  title: FesPay API（設計開始用・部分契約）
  version: 0.2.0-draft
  description: |
    EPP-API-001。現行要件v0.2と基本/詳細設計に基づくレビュー前の案。
    本人残高・取引照会・SSEに加え、現金払戻しと購入返金の更新/照会を定義する。
    チャージ/決済/譲渡、認証入口、管理系、注文/商品/CSV契約は後続設計。
    Cookie名/CSRF方式と取引種別は未決。実装・型生成前に解消する。
  x-status: draft-partial
  x-owner: natuki53
  x-updated-at: '2026-10-09'
  x-issue: https://github.com/fespay-team/fespay/issues/7
servers:
  - url: /
    description: 同一Origin。環境の実URLは環境設計で決定する
security:
  - sessionCookie: []
tags:
  - name: Wallets
    description: 本人のイベント内残高
  - name: Transactions
    description: 正本の取引と要求結果の照会
  - name: Notifications
    description: 正本の再取得を促す通知
  - name: CashRefunds
    description: 未使用残高と返金専用額の現金払戻し
  - name: PurchaseRefunds
    description: 元の店舗決済に対する購入取消・部分返金
paths:
  /v1/events/{event_id}/wallet:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getMyWallet
      tags: [Wallets]
      summary: 本人の残高3区分を取得
      description: |
        account_idは認証主体から取得。全3区分とversionを同一の正本時点で読む。
        available_amountのみ支払/譲渡可能。held/refund_onlyを加算しない。
        新規処理停止中も現在の本人照会資格を確認して取得できる。
      x-api-ids: [W01]
      x-requirement-ids: [WAL-01, WAL-02, WAL-03, API-01, ROL-02, CFG-03, CFG-04]
      x-acceptance-test-ids: [AT-021, AT-024, AT-042, AT-047, AT-058, AT-062]
      x-authorization: 本人、対象eventへの参加/履歴照会資格。任意の他者口座は指定不可
      responses:
        '200':
          $ref: '#/components/responses/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/events/{event_id}/wallet/summary:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getMyWalletSummary
      tags: [Wallets]
      summary: 本人の残高要約を取得
      description: W01と同じスキーマ・正本・認可。基本設計の2パスを維持する初回案で、統合はFEレビューで決定する。
      x-api-ids: [T01]
      x-requirement-ids: [WAL-01, WAL-02, WAL-03, API-01, ROL-02]
      x-acceptance-test-ids: [AT-024, AT-042, AT-047, AT-058, AT-062]
      x-authorization: 本人、対象eventへの参加/履歴照会資格
      responses:
        '200':
          $ref: '#/components/responses/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/events/{event_id}/transactions:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: listMyTransactions
      tags: [Transactions]
      summary: 本人が当事者の成立取引を取得
      description: |
        今回は本人一覧のみ。業務全件/店舗一覧、期間等のフィルターは後続設計。
        譲渡受取側を含む当事者で絞り、操作したactorだけで判定しない。
        occurred_at DESC, transaction_id DESCの順。カーソルは本人/event/条件に束縛。
        各ページは取得時の現在値で、CSV用固定snapshotではない。
        一覧未検出を要求の未成立証明として用いない。
      x-api-ids: [T04]
      x-requirement-ids: [ROL-02, ROL-03, ROL-06, DAT-02, API-01]
      x-acceptance-test-ids: [AT-037, AT-038, AT-058, AT-062]
      x-authorization: 本人、対象eventの履歴照会資格。業務操作として他者履歴は取得しない
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 本人の成立取引。終端のnext_cursorはnull
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/events/{event_id}/transactions/{transaction_id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - name: transaction_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ResourceId'
    get:
      operationId: getTransaction
      tags: [Transactions]
      summary: 取引IDから永続成立結果を照会
      description: |
        正本から取得し、event/対象店舗/当事者の関係と現在の照会権限を検証する。
        新規処理停止中も許可された既取引は照会可能。
        成立取引を返金・訂正で未成立に戻さない。返金・訂正は別取引。
        存在しない/秘匿対象の404は、未成立を保証しない。
      x-api-ids: [T03]
      x-requirement-ids: [TX-01, TX-05, API-02, API-03, ROL-03, ROL-06, CFG-03, CFG-04]
      x-acceptance-test-ids: [AT-021, AT-027, AT-037, AT-038, AT-058, AT-062]
      x-authorization: 本人当事者、または現在のevent/shop/操作別業務照会権限。過去の担当実績は不可
      responses:
        '200':
          description: 永続化済みの成立取引
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/events/{event_id}/transaction-results:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getMyTransactionResultByKey
      tags: [Transactions]
      summary: 本人が送信したコマンドの要求キーから結果を照会（追加パス案）
      description: |
        取引IDや払戻し/返金申出IDを受信できなかった場合の読取専用コマンド結果照会。
        認証主体/event/operation/Idempotency-Keyで正本の永続結果を検索する。
        結果を返す前に現在の本人/対象業務照会権限を再検証する。
        記録未検出はUNKNOWN。REJECTEDは永続的最終拒否が確認できる場合のみ。
        この照会で新規要求・取引を作成しない。キーはURL/通常ログに含めない。
      x-api-ids: [T03]
      x-requirement-ids: [TX-03, TX-05, TX-06, API-02, API-03, ROL-06, NET-02]
      x-acceptance-test-ids: [AT-026, AT-027, AT-037, AT-038, AT-058, AT-062]
      x-authorization: キーを送信した本人、かつ現在の結果対象への照会権限。キー単独では不可
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: operation
          in: query
          required: true
          description: 本版で定義した更新operationId。将来の操作追加時に拡張し、未知の操作は422。
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '^[a-z][A-Za-z0-9]*$'
            enum: [prepareCashRefund, approveCashRefund, startCashRefundHandover, completeCashRefund, handoverCashRefund, createPurchaseRefundRequest, executePurchaseRefund]
      responses:
        '200':
          description: 照会が成功。HTTP 200やコマンドSUCCEEDEDだけで金銭成立とせず、transactionまたはresourceの完了状態と取引IDを確認する
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/events/{event_id}/stream:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: subscribeEventUpdates
      tags: [Notifications]
      summary: 許可されたリソースの更新案内を購読
      description: |
        Cookie/Origin/event所属と送信対象の現在の権限を確認する。
        resource.changedはResourceChanged、resyncはResyncNoticeのJSONをdataに含む。
        idはOutbox UUID。通知は正本でなく、初回/再接続/更新時に正本を取得する。
        再開不可時はresync。通知失敗で取引を取り消さない。詳細はevents.md。
        接続開始後の認証/権限失効は接続終了で通知し、再接続時に再認可する。
      x-api-ids: [N01]
      x-requirement-ids: [TX-04, TX-05, NET-04, ROL-03, ROL-06, PWA-01]
      x-acceptance-test-ids: [AT-021, AT-036, AT-037, AT-058, AT-062]
      x-authorization: 有効セッションとevent所属/照会資格。送信対象ごとに現在の許可範囲を検証
      x-event-data-schemas:
        resource.changed:
          $ref: '#/components/schemas/ResourceChanged'
        resync:
          $ref: '#/components/schemas/ResyncNotice'
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: 最後のOutbox UUID。不明/権限外/保持範囲外は存在を明かさずresync
          schema:
            $ref: '#/components/schemas/ResourceId'
      responses:
        '200':
          description: SSEストリーム。コメントheartbeat 20秒案。重複排除と正本再取得が必要
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 11111111-1111-4111-8111-111111111111
                event: resource.changed
                data: {"resource_type":"wallet","resource_id":"22222222-2222-4222-8222-222222222222","version":"2"}

                event: resync
                data: {"reason":"CURSOR_UNAVAILABLE"}

        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/events/{event_id}/refund-requests:
    parameters:
    - $ref: '#/components/parameters/EventId'
    post:
      operationId: prepareCashRefund
      tags:
      - CashRefunds
      summary: 受付が現金払戻しを準備する
      description: 受付用QRから本人を特定し、相手・照合番号・額・元区分を確認してPREPAREDを保存する。対象区分の十分な残高を確認するが、まだ拘束・現金交付しない。本人はこの準備を照会してapproveする。AVAILABLEは通常受付ON/期間、REFUND_ONLYは精算用受付を検証。通常/返金専用額を合わせ本人/eventで未完了1件。QRの検証/消費と準備・監査・Outboxは同一Tx。同キー再送はQR再消費や新規準備をしない。
      x-api-ids:
      - H01
      x-requirement-ids:
      - CSH-01
      - CSH-02
      - CSH-03
      - CSH-04
      - CSH-05
      - CSH-06
      - TX-03
      - TX-04
      - TX-05
      - SEC-01
      - REF-03
      - WAL-02
      - API-01
      - API-02
      - API-03
      - API-04
      - ROL-03
      - ROL-06
      x-acceptance-test-ids:
      - AT-041
      - AT-042
      - AT-043
      - AT-044
      - AT-047
      - AT-058
      - AT-059
      x-authorization: 主催者または現金払戻し権限者。担当業務認証/受付と対象本人を検証
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareCashRefund'
      x-idempotency-scope:
      - actor_account_id
      - event_id
      - operationId
      - key
      x-request-hash-inputs:
      - method
      - event_id
      - operationId
      - path_resource_id
      - validated_body
      x-mfa: 業務追加認証：最大8時間・無操作30分。金額の都度確認
      x-state-transitions:
      - なし -> PREPARED
      responses:
        '201':
          $ref: '#/components/responses/CashRefund'
        '202':
          $ref: '#/components/responses/CommandPending'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: listCashRefunds
      tags:
      - CashRefunds
      summary: 払戻し準備・未完了・結果を一覧取得
      description: 本人はmineのみ。assignedは現在の担当かつ払戻し照会権限、eventは主催者/払戻し管理権限。created_at DESC, cash_refund_id DESC。INVESTIGATINGを含む未完了を保持。scope/status/cursorの条件をカーソルに束縛し毎回再認可。
      x-api-ids:
      - H01
      - H04
      x-requirement-ids:
      - CSH-01
      - CSH-02
      - CSH-03
      - CSH-04
      - CSH-05
      - CSH-06
      - TX-03
      - TX-04
      - TX-05
      - SEC-01
      - REF-03
      - WAL-02
      - API-01
      - API-02
      - API-03
      - API-04
      - ROL-03
      - ROL-06
      x-acceptance-test-ids:
      - AT-021
      - AT-043
      - AT-044
      - AT-047
      - AT-058
      - AT-059
      x-authorization: 本人当事者、現在の担当、主催者/払戻し管理者をscopeで分離
      responses:
        '200':
          $ref: '#/components/responses/CashRefundPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - mine
          - assigned
          - event
          default: mine
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PREPARED
          - HELD
          - CASH_HANDING
          - PAID
          - CANCELLED
          - INVESTIGATING
  /v1/events/{event_id}/refund-requests/{cash_refund_id}:
    parameters:
    - $ref: '#/components/parameters/EventId'
    - name: cash_refund_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    get:
      operationId: getCashRefund
      tags:
      - CashRefunds
      summary: 払戻しの現在状態を照会
      description: 新規処理停止/受付終了後も、本人または現在の担当/管理照会権限で既処理を照会できる。旧担当者は業務照会不可。PAIDだけが現金交付の完了記録。INVESTIGATINGは再交付の根拠にしない。
      x-api-ids:
      - C02
      - H01
      x-requirement-ids:
      - CSH-01
      - CSH-02
      - CSH-03
      - CSH-04
      - CSH-05
      - CSH-06
      - TX-03
      - TX-04
      - TX-05
      - SEC-01
      - REF-03
      - WAL-02
      - API-01
      - API-02
      - API-03
      - API-04
      - ROL-03
      - ROL-06
      x-acceptance-test-ids:
      - AT-021
      - AT-043
      - AT-044
      - AT-047
      - AT-058
      - AT-059
      x-authorization: 本人当事者または現在の払戻し担当/管理照会権限
      responses:
        '200':
          $ref: '#/components/responses/CashRefund'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/events/{event_id}/refund-requests/{cash_refund_id}/approve:
    parameters:
    - $ref: '#/components/parameters/EventId'
    - name: cash_refund_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    post:
      operationId: approveCashRefund
      tags:
      - CashRefunds
      summary: 本人が払戻し内容を承認し残高を拘束
      description: 準備の対象本人のみ。amount/balance_source/expected_versionが保存内容と一致することを検証。担当の現在の権限・業務認証、受付、本人状態、対象残高を全必要ロック後に再検証する。元区分減算、held加算、Hold/内部振替取引/台帳/監査/Outboxを単一Tx。担当者や主催者による代理承認は禁止。金額変更は未交付取消後の新準備。
      x-api-ids:
      - H01
      x-requirement-ids:
      - CSH-01
      - CSH-02
      - CSH-03
      - CSH-04
      - CSH-05
      - CSH-06
      - TX-03
      - TX-04
      - TX-05
      - SEC-01
      - REF-03
      - WAL-02
      - API-01
      - API-02
      - API-03
      - API-04
      - ROL-03
      - ROL-06
      x-acceptance-test-ids:
      - AT-034
      - AT-035
      - AT-042
      - AT-044
      - AT-047
      - AT-058
      - AT-059
      x-authorization: 対象本人のみ。業務権限で本人承認を代行しない
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveCashRefund'
      x-idempotency-scope:
      - actor_account_id
      - event_id
      - operationId
      - key
      x-request-hash-inputs:
      - method
      - event_id
      - operationId
      - path_resource_id
      - validated_body
      x-mfa: 本人の通常セッション。一般来場者MFAは任意
      x-state-transitions:
      - PREPARED -> HELD
      responses:
        '200':
          $ref: '#/components/responses/CashRefund'
        '202':
          $ref: '#/components/responses/CommandPending'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
