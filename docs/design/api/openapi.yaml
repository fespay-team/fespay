components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __SESSION_COOKIE_TBD__
      description: Better AuthセッションCookie。実名・具体属性は未決で、実装/型生成前に確定する
      x-unresolved: true
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRFトークンヘッダーの提案。Cookie/Origin併用と具体発行/検証は認証設計で確定
      x-unresolved: true
  parameters:
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    Cursor:
      name: cursor
      in: query
      required: false
      description: 前ページのnext_cursor。不透明。別本人/event/条件への流用や不正形式は422
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 元要求と同じキー。1～128文字、ASCII可視文字（空白除外）。照会はこのキーを消費しない
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]{1,128}$'
  headers:
    NoStore:
      description: 個人APIの応答を保存しない
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: 次の要求まで待つ秒数。提案値
      schema:
        type: string
        pattern: '^[0-9]+$'
  schemas:
    ResourceId:
      type: string
      format: uuid
      description: 推測困難で不変の公開UUID案。認可は毎回別途検証する
    UtcDateTime:
      type: string
      format: date-time
      pattern: 'Z$'
      examples: ['2026-10-09T00:00:00Z']
    Money:
      type: string
      pattern: '^(0|[1-9][0-9]{0,29})$'
      description: 0以上の円額。残高用。集計金額へ30桁制限を流用しない
      examples: ['0', '1500', '9007199254740993']
    PositiveMoney:
      type: string
      pattern: '^[1-9][0-9]{0,29}$'
      description: 1円以上の取引額。業務上限ではなく技術上の30桁表現範囲
      examples: ['1500', '9007199254740993']
    Version:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: 正の整数版。DB bigint等から精度を失わず文字列化する案
    Wallet:
      type: object
      additionalProperties: false
      required: [wallet_id, event_id, currency, available_amount, held_amount, refund_only_amount, version, checked_at]
      properties:
        wallet_id:
          $ref: '#/components/schemas/ResourceId'
        event_id:
          $ref: '#/components/schemas/ResourceId'
        currency:
          type: string
          const: JPY
        available_amount:
          $ref: '#/components/schemas/Money'
        held_amount:
          $ref: '#/components/schemas/Money'
        refund_only_amount:
          $ref: '#/components/schemas/Money'
        version:
          $ref: '#/components/schemas/Version'
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
      examples:
        - wallet_id: 22222222-2222-4222-8222-222222222222
          event_id: 33333333-3333-4333-8333-333333333333
          currency: JPY
          available_amount: '9007199254740993'
          held_amount: '500'
          refund_only_amount: '100'
          version: '2'
          checked_at: '2026-10-09T00:00:00Z'
    Transaction:
      type: object
      additionalProperties: false
      required: [transaction_id, event_id, type, status, amount, currency, occurred_at]
      properties:
        transaction_id:
          $ref: '#/components/schemas/ResourceId'
        event_id:
          $ref: '#/components/schemas/ResourceId'
        type:
          type: string
          minLength: 1
          description: 取引種別。正式enumと画面表示はDB/金銭更新設計と合わせて固定する
          x-unresolved: true
        status:
          type: string
          const: SUCCEEDED
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        currency:
          type: string
          const: JPY
        occurred_at:
          $ref: '#/components/schemas/UtcDateTime'
        source_transaction_id:
          $ref: '#/components/schemas/ResourceId'
          description: 返金/訂正等で参照する元取引。親event一致と現在の照会権限を検証する
    TransactionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, checked_at]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Transaction'
        next_cursor:
          type: [string, 'null']
          minLength: 1
          description: 終端はnull
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
    RequestResult:
      oneOf:
        - $ref: '#/components/schemas/SucceededResult'
        - $ref: '#/components/schemas/RejectedResult'
        - $ref: '#/components/schemas/UnresolvedResult'
    SucceededResult:
      type: object
      additionalProperties: false
      required:
      - status
      - checked_at
      properties:
        status:
          type: string
          const: SUCCEEDED
        transaction:
          $ref: '#/components/schemas/Transaction'
        resource:
          oneOf:
          - $ref: '#/components/schemas/CashRefund'
          - $ref: '#/components/schemas/PurchaseRefund'
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
      oneOf:
      - required:
        - transaction
        properties:
          transaction: {}
      - required:
        - resource
        properties:
          resource: {}
      description: 元コマンドの効果が永続成立。resourceの現在状態を返す。PREPARED/REQUESTED等は返金/現金交付完了ではない
    RejectedResult:
      type: object
      additionalProperties: false
      required: [status, rejection, checked_at]
      properties:
        status:
          type: string
          const: REJECTED
        rejection:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              minLength: 1
              description: 永続的最終拒否の業務コード。語彙は更新契約で定義
            message:
              type: string
              minLength: 1
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
    UnresolvedResult:
      type: object
      additionalProperties: false
      required: [status, checked_at]
      properties:
        status:
          type: string
          enum: [PENDING, UNKNOWN]
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
      examples:
        - status: UNKNOWN
          checked_at: '2026-10-09T00:00:00Z'
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
          description: 調査用識別子。業務取引IDや冪等キーと区別する
        retryable:
          type: boolean
          description: 同じ要求を再試行できるか。新キーでの金銭再処理を許可しない
        current_state_or_query:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            resource_id:
              $ref: '#/components/schemas/ResourceId'
            status:
              type: string
            query_path:
              type: string
              pattern: '^/v1/'
              description: 許可された相対GET照会パス。秘密キー・tokenは含めない
    ResourceChanged:
      type: object
      additionalProperties: false
      required: [resource_type, resource_id]
      properties:
        resource_type:
          type: string
          enum: [wallet, transaction, payment_request, order, cash_refund, purchase_refund]
        resource_id:
          $ref: '#/components/schemas/ResourceId'
        version:
          $ref: '#/components/schemas/Version'
      if:
        properties:
          resource_type:
            enum: [wallet, payment_request, order, cash_refund, purchase_refund]
      then:
        properties:
          version:
            $ref: '#/components/schemas/Version'
        required: [version]
    ResyncNotice:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [CURSOR_UNAVAILABLE, RECONNECT_REQUIRED]
    Reason:
      type: string
      minLength: 1
      maxLength: 1000
      pattern: \S
      description: 理由。長さは補完案。空白のみは拒否し、通常ログへ全文を出さない
    PrepareCashRefund:
      type: object
      additionalProperties: false
      required:
      - identity_token
      - amount
      - balance_source
      properties:
        identity_token:
          type: string
          minLength: 1
          writeOnly: true
          description: 受付用60秒QRの不透明token。用途/event/subject/期限をサーバー照合。生値を保存・通常ログ出力しない
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        balance_source:
          type: string
          enum:
          - AVAILABLE
          - REFUND_ONLY
    ApproveCashRefund:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - amount
      - balance_source
      - approved
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        balance_source:
          type: string
          enum:
          - AVAILABLE
          - REFUND_ONLY
        approved:
          type: boolean
          const: true
    CashRefundVersionInput:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
    CompleteCashRefundPaid:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - outcome
      - cash_delivered_confirmed
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
        outcome:
          type: string
          const: PAID
        cash_delivered_confirmed:
          type: boolean
          const: true
        resolution_case_id:
          $ref: '#/components/schemas/ResourceId'
    CompleteCashRefundCancelled:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - outcome
      - cash_not_delivered_confirmed
      - reason
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
        outcome:
          type: string
          const: CANCELLED
        cash_not_delivered_confirmed:
          type: boolean
          const: true
        reason:
          $ref: '#/components/schemas/Reason'
        resolution_case_id:
          $ref: '#/components/schemas/ResourceId'
    CompleteCashRefundInvestigating:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - outcome
      - reason
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
        outcome:
          type: string
          const: INVESTIGATING
        reason:
          $ref: '#/components/schemas/Reason'
    CompleteCashRefund:
      oneOf:
      - $ref: '#/components/schemas/CompleteCashRefundPaid'
      - $ref: '#/components/schemas/CompleteCashRefundCancelled'
      - $ref: '#/components/schemas/CompleteCashRefundInvestigating'
    HandoverCashRefund:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - new_operator_account_id
      - reason
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
        new_operator_account_id:
          $ref: '#/components/schemas/ResourceId'
        reason:
          $ref: '#/components/schemas/Reason'
    CashRefund:
      type: object
      additionalProperties: false
      required:
      - cash_refund_id
      - event_id
      - target
      - assigned_operator_account_id
      - amount
      - currency
      - balance_source
      - status
      - version
      - created_at
      - checked_at
      properties:
        cash_refund_id:
          $ref: '#/components/schemas/ResourceId'
        event_id:
          $ref: '#/components/schemas/ResourceId'
        target:
          type: object
          additionalProperties: false
          required:
          - account_id
          - display_name
          - verification_code
          properties:
            account_id:
              $ref: '#/components/schemas/ResourceId'
            display_name:
              type: string
              minLength: 1
              maxLength: 40
            verification_code:
              type: string
              minLength: 1
              description: 本人と受付の照合用表示番号。認証秘密ではなく権限や現金交付の根拠にしない
        assigned_operator_account_id:
          $ref: '#/components/schemas/ResourceId'
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        currency:
          type: string
          const: JPY
        balance_source:
          type: string
          enum:
          - AVAILABLE
          - REFUND_ONLY
        status:
          type: string
          enum:
          - PREPARED
          - HELD
          - CASH_HANDING
          - PAID
          - CANCELLED
          - INVESTIGATING
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
        hold_transaction_id:
          $ref: '#/components/schemas/ResourceId'
        cash_transaction_id:
          $ref: '#/components/schemas/ResourceId'
        release_transaction_id:
          $ref: '#/components/schemas/ResourceId'
        cancellation_reason:
          $ref: '#/components/schemas/Reason'
        cash_not_delivered_confirmed:
          type: boolean
          const: true
        investigation_reason:
          $ref: '#/components/schemas/Reason'
        case_id:
          $ref: '#/components/schemas/ResourceId'
      allOf:
      - if:
          properties:
            status:
              type: string
              enum:
              - HELD
              - CASH_HANDING
              - PAID
        then:
          required:
          - hold_transaction_id
          properties:
            hold_transaction_id: {}
      - if:
          properties:
            status:
              type: string
              const: PAID
        then:
          required:
          - cash_transaction_id
          properties:
            cash_transaction_id: {}
        else:
          not:
            required:
            - cash_transaction_id
            properties:
              cash_transaction_id: {}
      - if:
          properties:
            status:
              type: string
              const: PREPARED
        then:
          not:
            anyOf:
            - required:
              - hold_transaction_id
              properties:
                hold_transaction_id: {}
            - required:
              - release_transaction_id
              properties:
                release_transaction_id: {}
      - if:
          properties:
            status:
              type: string
              const: CANCELLED
        then:
          required:
          - cancellation_reason
          - cash_not_delivered_confirmed
          if:
            required:
            - hold_transaction_id
            properties:
              hold_transaction_id: {}
          then:
            required:
            - release_transaction_id
            properties:
              release_transaction_id: {}
          properties:
            cancellation_reason: {}
            cash_not_delivered_confirmed: {}
      - if:
          properties:
            status:
              type: string
              const: INVESTIGATING
        then:
          required:
          - investigation_reason
          - case_id
          - hold_transaction_id
          properties:
            investigation_reason: {}
            case_id: {}
            hold_transaction_id: {}
      - if:
          required:
          - release_transaction_id
          properties:
            release_transaction_id: {}
        then:
          properties:
            status:
              type: string
              const: CANCELLED
    CashRefundPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      - checked_at
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CashRefund'
        next_cursor:
          type:
          - string
          - 'null'
          minLength: 1
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
    PurchaseRefundLineInput:
      type: object
      additionalProperties: false
      required:
      - original_order_line_id
      - quantity
      properties:
        original_order_line_id:
          $ref: '#/components/schemas/ResourceId'
        quantity:
          type: integer
          minimum: 1
          maximum: 999
          description: 元購入数量・既返金数量もサーバー検証。999は既存補完案
    CreateAmountRefund:
      type: object
      additionalProperties: false
      required:
      - original_transaction_id
      - basis
      - amount
      - reason
      properties:
        original_transaction_id:
          $ref: '#/components/schemas/ResourceId'
        basis:
          type: string
          const: AMOUNT
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        reason:
          $ref: '#/components/schemas/Reason'
    CreateItemsRefund:
      type: object
      additionalProperties: false
      required:
      - original_transaction_id
      - basis
      - lines
      - reason
      properties:
        original_transaction_id:
          $ref: '#/components/schemas/ResourceId'
        basis:
          type: string
          const: ITEMS
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PurchaseRefundLineInput'
          description: 同じ元明細IDの重複は422。元決済の単価でサーバー計算
        reason:
          $ref: '#/components/schemas/Reason'
    CreatePurchaseRefund:
      oneOf:
      - $ref: '#/components/schemas/CreateAmountRefund'
      - $ref: '#/components/schemas/CreateItemsRefund'
    PurchaseRefundLine:
      type: object
      additionalProperties: false
      required:
      - refund_line_id
      - original_order_line_id
      - quantity
      - unit_price
      - amount
      properties:
        refund_line_id:
          $ref: '#/components/schemas/ResourceId'
        original_order_line_id:
          $ref: '#/components/schemas/ResourceId'
        quantity:
          type: integer
          minimum: 1
          maximum: 999
        unit_price:
          $ref: '#/components/schemas/PositiveMoney'
        amount:
          $ref: '#/components/schemas/PositiveMoney'
    ExecutePurchaseRefund:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - confirmed
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
        confirmed:
          type: boolean
          const: true
    PurchaseRefund:
      type: object
      additionalProperties: false
      required:
      - purchase_refund_id
      - event_id
      - shop_id
      - original_transaction_id
      - payer_account_id
      - basis
      - amount
      - currency
      - status
      - reason
      - version
      - created_at
      - checked_at
      properties:
        purchase_refund_id:
          $ref: '#/components/schemas/ResourceId'
        event_id:
          $ref: '#/components/schemas/ResourceId'
        shop_id:
          $ref: '#/components/schemas/ResourceId'
        original_transaction_id:
          $ref: '#/components/schemas/ResourceId'
        payer_account_id:
          $ref: '#/components/schemas/ResourceId'
        basis:
          type: string
          enum:
          - AMOUNT
          - ITEMS
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        currency:
          type: string
          const: JPY
        status:
          type: string
          enum:
          - REQUESTED
          - INVESTIGATING
          - SUCCEEDED
          - REJECTED
        reason:
          $ref: '#/components/schemas/Reason'
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PurchaseRefundLine'
        credited_to:
          type: string
          enum:
          - AVAILABLE
          - REFUND_ONLY
        refund_transaction_id:
          $ref: '#/components/schemas/ResourceId'
        investigation_code:
          type: string
          minLength: 1
        rejection_code:
          type: string
          minLength: 1
      allOf:
      - if:
          properties:
            basis:
              type: string
              const: ITEMS
        then:
          required:
          - lines
          properties:
            lines: {}
        else:
          not:
            required:
            - lines
            properties:
              lines: {}
      - if:
          properties:
            status:
              type: string
              const: SUCCEEDED
        then:
          required:
          - credited_to
          - refund_transaction_id
          properties:
            credited_to: {}
            refund_transaction_id: {}
        else:
          not:
            anyOf:
            - required:
              - credited_to
              properties:
                credited_to: {}
            - required:
              - refund_transaction_id
              properties:
                refund_transaction_id: {}
      - if:
          properties:
            status:
              type: string
              const: INVESTIGATING
        then:
          required:
          - investigation_code
          properties:
            investigation_code: {}
      - if:
          properties:
            status:
              type: string
              const: REJECTED
        then:
          required:
          - rejection_code
          properties:
            rejection_code: {}
    PurchaseRefundPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      - checked_at
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PurchaseRefund'
        next_cursor:
          type:
          - string
          - 'null'
          minLength: 1
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
  responses:
    Wallet:
      description: 同じ正本時点で確認した残高3区分
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Wallet'
    Unauthorized:
      description: AUTH_REQUIRED / AUTH_INVALID。再ログイン後も元のキーで照会する
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: FORBIDDEN。現在の照会権限なし
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: RESOURCE_NOT_FOUND。不在/秘匿対象。キー未検出だけなら200 UNKNOWNで、404を未成立証明にしない
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidInput:
      description: VALIDATION_ERROR。ID、未知入力、範囲、未対応operation、不正カーソル
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: RATE_LIMITED。指定秒数待機後に同じ要求を照会する
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: INTERNAL_ERROR。request_idで調査。内部SQL/stack/秘密を返さず、未成立を断定しない
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: DEPENDENCY_UNAVAILABLE / DB_UNAVAILABLE。正本確認不能。未成立/最終拒否として扱わない
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CashRefund:
      description: CashRefundの正本。更新応答はCOMMIT後。状態が完了するまで金銭交付/返金済みと表示しない
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CashRefund'
    CashRefundPage:
      description: CashRefundPageの正本。更新応答はCOMMIT後。状態が完了するまで金銭交付/返金済みと表示しない
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CashRefundPage'
    PurchaseRefund:
      description: PurchaseRefundの正本。更新応答はCOMMIT後。状態が完了するまで金銭交付/返金済みと表示しない
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PurchaseRefund'
    PurchaseRefundPage:
      description: PurchaseRefundPageの正本。更新応答はCOMMIT後。状態が完了するまで金銭交付/返金済みと表示しない
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PurchaseRefundPage'
    Conflict:
      description: INVALID_STATE / VERSION_CONFLICT / IDEMPOTENCY_CONFLICT / INSUFFICIENT_BALANCE / TOKEN_EXPIRED
        / TOKEN_CONSUMED / REFUND_LIMIT_EXCEEDED。状態と照会先を現在の権限内で返す。部分更新なし
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CommandPending:
      description: REQUEST_IN_PROGRESS / RESULT_UNKNOWN。元キーで照会する。202は返金/現金交付完了の意味ではない
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
