openapi: 3.1.0
info:
  title: FesPay API（設計開始用・部分契約）
  version: 0.1.0-draft
  description: |
    EPP-API-001。現行要件v0.2と基本/詳細設計に基づくレビュー前の案。
    本人残高・本人履歴・取引照会・要求キー照会・SSEのみを先行定義する。
    金銭更新API、認証入口、管理系、注文/商品/CSV契約は未定義。
    Cookie名とoperation/取引種別の語彙は未決。実装・型生成前に解消する。
  x-status: draft-partial
  x-owner: natuki53
  x-updated-at: '2026-10-09'
  x-issue: https://github.com/fespay-team/fespay/issues/7
servers:
  - url: /
    description: 同一Origin。環境の実URLは環境設計で決定する
security:
  - sessionCookie: []
tags:
  - name: Wallets
    description: 本人のイベント内残高
  - name: Transactions
    description: 正本の取引と要求結果の照会
  - name: Notifications
    description: 正本の再取得を促す通知
paths:
  /v1/events/{event_id}/wallet:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getMyWallet
      tags: [Wallets]
      summary: 本人の残高3区分を取得
      description: |
        account_idは認証主体から取得。全3区分とversionを同一の正本時点で読む。
        available_amountのみ支払/譲渡可能。held/refund_onlyを加算しない。
        新規処理停止中も現在の本人照会資格を確認して取得できる。
      x-api-ids: [W01]
      x-requirement-ids: [WAL-01, WAL-02, WAL-03, API-01, ROL-02, CFG-03, CFG-04]
      x-acceptance-test-ids: [AT-021, AT-024, AT-042, AT-047, AT-058, AT-062]
      x-authorization: 本人、対象eventへの参加/履歴照会資格。任意の他者口座は指定不可
      responses:
        '200':
          $ref: '#/components/responses/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/events/{event_id}/wallet/summary:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getMyWalletSummary
      tags: [Wallets]
      summary: 本人の残高要約を取得
      description: W01と同じスキーマ・正本・認可。基本設計の2パスを維持する初回案で、統合はFEレビューで決定する。
      x-api-ids: [T01]
      x-requirement-ids: [WAL-01, WAL-02, WAL-03, API-01, ROL-02]
      x-acceptance-test-ids: [AT-024, AT-042, AT-047, AT-058, AT-062]
      x-authorization: 本人、対象eventへの参加/履歴照会資格
      responses:
        '200':
          $ref: '#/components/responses/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/events/{event_id}/transactions:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: listMyTransactions
      tags: [Transactions]
      summary: 本人が当事者の成立取引を取得
      description: |
        今回は本人一覧のみ。業務全件/店舗一覧、期間等のフィルターは後続設計。
        譲渡受取側を含む当事者で絞り、操作したactorだけで判定しない。
        occurred_at DESC, transaction_id DESCの順。カーソルは本人/event/条件に束縛。
        各ページは取得時の現在値で、CSV用固定snapshotではない。
        一覧未検出を要求の未成立証明として用いない。
      x-api-ids: [T04]
      x-requirement-ids: [ROL-02, ROL-03, ROL-06, DAT-02, API-01]
      x-acceptance-test-ids: [AT-037, AT-038, AT-058, AT-062]
      x-authorization: 本人、対象eventの履歴照会資格。業務操作として他者履歴は取得しない
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 本人の成立取引。終端のnext_cursorはnull
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/events/{event_id}/transactions/{transaction_id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - name: transaction_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ResourceId'
    get:
      operationId: getTransaction
      tags: [Transactions]
      summary: 取引IDから永続成立結果を照会
      description: |
        正本から取得し、event/対象店舗/当事者の関係と現在の照会権限を検証する。
        新規処理停止中も許可された既取引は照会可能。
        成立取引を返金・訂正で未成立に戻さない。返金・訂正は別取引。
        存在しない/秘匿対象の404は、未成立を保証しない。
      x-api-ids: [T03]
      x-requirement-ids: [TX-01, TX-05, API-02, API-03, ROL-03, ROL-06, CFG-03, CFG-04]
      x-acceptance-test-ids: [AT-021, AT-027, AT-037, AT-038, AT-058, AT-062]
      x-authorization: 本人当事者、または現在のevent/shop/操作別業務照会権限。過去の担当実績は不可
      responses:
        '200':
          description: 永続化済みの成立取引
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/events/{event_id}/transaction-results:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getMyTransactionResultByKey
      tags: [Transactions]
      summary: 本人が送信した要求キーから結果を照会（追加パス案）
      description: |
        取引IDを受信できなかった場合の読取専用照会。
        認証主体/event/operation/Idempotency-Keyで正本の永続結果を検索する。
        結果を返す前に現在の本人/対象業務照会権限を再検証する。
        記録未検出はUNKNOWN。REJECTEDは永続的最終拒否が確認できる場合のみ。
        この照会で新規要求・取引を作成しない。キーはURL/通常ログに含めない。
      x-api-ids: [T03]
      x-requirement-ids: [TX-03, TX-05, TX-06, API-02, API-03, ROL-06, NET-02]
      x-acceptance-test-ids: [AT-026, AT-027, AT-037, AT-038, AT-058, AT-062]
      x-authorization: キーを送信した本人、かつ現在の結果対象への照会権限。キー単独では不可
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: operation
          in: query
          required: true
          description: 金銭更新operationIdに対応させる案。正式語彙は更新契約で定義し、未知の操作は422。
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '^[a-z][A-Za-z0-9]*$'
      responses:
        '200':
          description: 照会が成功。HTTP 200自体は金銭成立を意味せず、bodyのstatusで判定する
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/events/{event_id}/stream:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: subscribeEventUpdates
      tags: [Notifications]
      summary: 許可されたリソースの更新案内を購読
      description: |
        Cookie/Origin/event所属と送信対象の現在の権限を確認する。
        resource.changedはResourceChanged、resyncはResyncNoticeのJSONをdataに含む。
        idはOutbox UUID。通知は正本でなく、初回/再接続/更新時に正本を取得する。
        再開不可時はresync。通知失敗で取引を取り消さない。詳細はevents.md。
        接続開始後の認証/権限失効は接続終了で通知し、再接続時に再認可する。
      x-api-ids: [N01]
      x-requirement-ids: [TX-04, TX-05, NET-04, ROL-03, ROL-06, PWA-01]
      x-acceptance-test-ids: [AT-021, AT-036, AT-037, AT-058, AT-062]
      x-authorization: 有効セッションとevent所属/照会資格。送信対象ごとに現在の許可範囲を検証
      x-event-data-schemas:
        resource.changed:
          $ref: '#/components/schemas/ResourceChanged'
        resync:
          $ref: '#/components/schemas/ResyncNotice'
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: 最後のOutbox UUID。不明/権限外/保持範囲外は存在を明かさずresync
          schema:
            $ref: '#/components/schemas/ResourceId'
      responses:
        '200':
          description: SSEストリーム。コメントheartbeat 20秒案。重複排除と正本再取得が必要
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: 11111111-1111-4111-8111-111111111111
                event: resource.changed
                data: {"resource_type":"wallet","resource_id":"22222222-2222-4222-8222-222222222222","version":"2"}

                event: resync
                data: {"reason":"CURSOR_UNAVAILABLE"}

        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __SESSION_COOKIE_TBD__
      description: Better AuthセッションCookie。実名・具体属性は未決で、実装/型生成前に確定する
      x-unresolved: true
  parameters:
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    Cursor:
      name: cursor
      in: query
      required: false
      description: 前ページのnext_cursor。不透明。別本人/event/条件への流用や不正形式は422
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 元要求と同じキー。1～128文字、ASCII可視文字（空白除外）。照会はこのキーを消費しない
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]{1,128}$'
  headers:
    NoStore:
      description: 個人APIの応答を保存しない
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: 次の要求まで待つ秒数。提案値
      schema:
        type: string
        pattern: '^[0-9]+$'
  schemas:
    ResourceId:
      type: string
      format: uuid
      description: 推測困難で不変の公開UUID案。認可は毎回別途検証する
    UtcDateTime:
      type: string
      format: date-time
      pattern: 'Z$'
      examples: ['2026-10-09T00:00:00Z']
    Money:
      type: string
      pattern: '^(0|[1-9][0-9]{0,29})$'
      description: 0以上の円額。残高用。集計金額へ30桁制限を流用しない
      examples: ['0', '1500', '9007199254740993']
    PositiveMoney:
      type: string
      pattern: '^[1-9][0-9]{0,29}$'
      description: 1円以上の取引額。業務上限ではなく技術上の30桁表現範囲
      examples: ['1500', '9007199254740993']
    Version:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: 正の整数版。DB bigint等から精度を失わず文字列化する案
    Wallet:
      type: object
      additionalProperties: false
      required: [wallet_id, event_id, currency, available_amount, held_amount, refund_only_amount, version, checked_at]
      properties:
        wallet_id:
          $ref: '#/components/schemas/ResourceId'
        event_id:
          $ref: '#/components/schemas/ResourceId'
        currency:
          type: string
          const: JPY
        available_amount:
          $ref: '#/components/schemas/Money'
        held_amount:
          $ref: '#/components/schemas/Money'
        refund_only_amount:
          $ref: '#/components/schemas/Money'
        version:
          $ref: '#/components/schemas/Version'
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
      examples:
        - wallet_id: 22222222-2222-4222-8222-222222222222
          event_id: 33333333-3333-4333-8333-333333333333
          currency: JPY
          available_amount: '9007199254740993'
          held_amount: '500'
          refund_only_amount: '100'
          version: '2'
          checked_at: '2026-10-09T00:00:00Z'
    Transaction:
      type: object
      additionalProperties: false
      required: [transaction_id, event_id, type, status, amount, currency, occurred_at]
      properties:
        transaction_id:
          $ref: '#/components/schemas/ResourceId'
        event_id:
          $ref: '#/components/schemas/ResourceId'
        type:
          type: string
          minLength: 1
          description: 取引種別。正式enumと画面表示はDB/金銭更新設計と合わせて固定する
          x-unresolved: true
        status:
          type: string
          const: SUCCEEDED
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        currency:
          type: string
          const: JPY
        occurred_at:
          $ref: '#/components/schemas/UtcDateTime'
        source_transaction_id:
          $ref: '#/components/schemas/ResourceId'
          description: 返金/訂正等で参照する元取引。親event一致と現在の照会権限を検証する
    TransactionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, checked_at]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Transaction'
        next_cursor:
          type: [string, 'null']
          minLength: 1
          description: 終端はnull
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
    RequestResult:
      oneOf:
        - $ref: '#/components/schemas/SucceededResult'
        - $ref: '#/components/schemas/RejectedResult'
        - $ref: '#/components/schemas/UnresolvedResult'
    SucceededResult:
      type: object
      additionalProperties: false
      required: [status, transaction, checked_at]
      properties:
        status:
          type: string
          const: SUCCEEDED
        transaction:
          $ref: '#/components/schemas/Transaction'
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
    RejectedResult:
      type: object
      additionalProperties: false
      required: [status, rejection, checked_at]
      properties:
        status:
          type: string
          const: REJECTED
        rejection:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              minLength: 1
              description: 永続的最終拒否の業務コード。語彙は更新契約で定義
            message:
              type: string
              minLength: 1
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
    UnresolvedResult:
      type: object
      additionalProperties: false
      required: [status, checked_at]
      properties:
        status:
          type: string
          enum: [PENDING, UNKNOWN]
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
      examples:
        - status: UNKNOWN
          checked_at: '2026-10-09T00:00:00Z'
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
          description: 調査用識別子。業務取引IDや冪等キーと区別する
        retryable:
          type: boolean
          description: 同じ要求を再試行できるか。新キーでの金銭再処理を許可しない
        current_state_or_query:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            resource_id:
              $ref: '#/components/schemas/ResourceId'
            status:
              type: string
            query_path:
              type: string
              pattern: '^/v1/'
              description: 許可された相対GET照会パス。秘密キー・tokenは含めない
    ResourceChanged:
      type: object
      additionalProperties: false
      required: [resource_type, resource_id]
      properties:
        resource_type:
          type: string
          enum: [wallet, transaction, payment_request, order]
        resource_id:
          $ref: '#/components/schemas/ResourceId'
        version:
          $ref: '#/components/schemas/Version'
      if:
        properties:
          resource_type:
            enum: [wallet, payment_request, order]
      then:
        properties:
          version:
            $ref: '#/components/schemas/Version'
        required: [version]
    ResyncNotice:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [CURSOR_UNAVAILABLE, RECONNECT_REQUIRED]
  responses:
    Wallet:
      description: 同じ正本時点で確認した残高3区分
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Wallet'
    Unauthorized:
      description: AUTH_REQUIRED / AUTH_INVALID。再ログイン後も元のキーで照会する
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: FORBIDDEN。現在の照会権限なし
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: RESOURCE_NOT_FOUND。不在/秘匿対象。キー未検出だけなら200 UNKNOWNで、404を未成立証明にしない
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidInput:
      description: VALIDATION_ERROR。ID、未知入力、範囲、未対応operation、不正カーソル
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: RATE_LIMITED。指定秒数待機後に同じ要求を照会する
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: INTERNAL_ERROR。request_idで調査。内部SQL/stack/秘密を返さず、未成立を断定しない
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: DEPENDENCY_UNAVAILABLE / DB_UNAVAILABLE。正本確認不能。未成立/最終拒否として扱わない
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
