              description: 必要時__Host-fespay.sessionをSecure/HttpOnly/SameSite=Lax/Path=/、Domainなしで設定。期限/失効はサーバーで確認
      security: []
      parameters:
      - name: code
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SecretToken'
      - name: state
        in: query
        required: true
        schema:
