        new_operator_account_id:
          $ref: '#/components/schemas/ResourceId'
        reason:
          $ref: '#/components/schemas/Reason'
    CashRefund:
      type: object
      additionalProperties: false
      required:
      - cash_refund_id
      - event_id
      - target
      - assigned_operator_account_id
      - amount
      - currency
      - balance_source
      - status
      - version
      - created_at
      - checked_at
      properties:
        cash_refund_id:
          $ref: '#/components/schemas/ResourceId'
        event_id:
          $ref: '#/components/schemas/ResourceId'
        target:
          type: object
          additionalProperties: false
          required:
          - account_id
          - display_name
          - verification_code
          properties:
            account_id:
              $ref: '#/components/schemas/ResourceId'
            display_name:
              type: string
              minLength: 1
              maxLength: 40
            verification_code:
              type: string
              minLength: 1
              description: 本人と受付の照合用表示番号。認証秘密ではなく権限や現金交付の根拠にしない
        assigned_operator_account_id:
          $ref: '#/components/schemas/ResourceId'
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        currency:
          type: string
          const: JPY
        balance_source:
          type: string
          enum:
          - AVAILABLE
          - REFUND_ONLY
        status:
          type: string
          enum:
          - PREPARED
          - HELD
          - CASH_HANDING
          - PAID
          - CANCELLED
          - INVESTIGATING
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          $ref: '#/components/schemas/UtcDateTime'
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
        hold_transaction_id:
          $ref: '#/components/schemas/ResourceId'
        cash_transaction_id:
          $ref: '#/components/schemas/ResourceId'
        release_transaction_id:
          $ref: '#/components/schemas/ResourceId'
        cancellation_reason:
          $ref: '#/components/schemas/Reason'
        cash_not_delivered_confirmed:
          type: boolean
          const: true
        investigation_reason:
          $ref: '#/components/schemas/Reason'
        case_id:
          $ref: '#/components/schemas/ResourceId'
      allOf:
      - if:
          properties:
            status:
              type: string
              enum:
              - HELD
              - CASH_HANDING
              - PAID
        then:
          required:
          - hold_transaction_id
          properties:
            hold_transaction_id: {}
      - if:
          properties:
            status:
              type: string
              const: PAID
        then:
          required:
          - cash_transaction_id
          properties:
            cash_transaction_id: {}
        else:
          not:
            required:
            - cash_transaction_id
            properties:
              cash_transaction_id: {}
      - if:
          properties:
            status:
              type: string
              const: PREPARED
        then:
          not:
            anyOf:
            - required:
              - hold_transaction_id
              properties:
                hold_transaction_id: {}
            - required:
              - release_transaction_id
              properties:
                release_transaction_id: {}
      - if:
          properties:
            status:
              type: string
              const: CANCELLED
        then:
          required:
          - cancellation_reason
          - cash_not_delivered_confirmed
          if:
            required:
            - hold_transaction_id
            properties:
              hold_transaction_id: {}
          then:
            required:
            - release_transaction_id
            properties:
              release_transaction_id: {}
          properties:
            cancellation_reason: {}
            cash_not_delivered_confirmed: {}
      - if:
          properties:
            status:
              type: string
              const: INVESTIGATING
        then:
          required:
          - investigation_reason
          - case_id
          - hold_transaction_id
          properties:
            investigation_reason: {}
            case_id: {}
            hold_transaction_id: {}
      - if:
          required:
          - release_transaction_id
          properties:
            release_transaction_id: {}
        then:
          properties:
            status:
              type: string
              const: CANCELLED
