components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-fespay.session
      description: ADR-0003の提案。Secure/HttpOnly/SameSite=Lax/Path=/、Domainなし。Better Authとの具体設定は統合時に検証
      x-unresolved: false
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: GET /v1/auth/contextで発行するセッション/事前認証文脈に束縛した同期トークン。Origin許可リストも必須。ADR-0003の提案
      x-unresolved: false
  parameters:
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceId'
    Cursor:
      name: cursor
      in: query
      required: false
      description: 前ページのnext_cursor。不透明。別本人/event/条件への流用や不正形式は422
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 元要求と同じキー。1～128文字、ASCII可視文字（空白除外）。照会はこのキーを消費しない
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]{1,128}$
  headers:
    NoStore:
      description: 個人APIの応答を保存しない
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: 次の要求まで待つ秒数。提案値
      schema:
        type: string
        pattern: ^[0-9]+$
  schemas:
    ResourceId:
      type: string
      format: uuid
      description: 推測困難で不変の公開UUID案。認可は毎回別途検証する
    UtcDateTime:
      type: string
      format: date-time
      pattern: Z$
      examples:
      - '2026-10-09T00:00:00Z'
    Money:
      type: string
      pattern: ^(0|[1-9][0-9]{0,29})$
      description: 0以上の円額。残高用。集計金額へ30桁制限を流用しない
      examples:
      - '0'
      - '1500'
      - '9007199254740993'
    PositiveMoney:
      type: string
      pattern: ^[1-9][0-9]{0,29}$
      description: 1円以上の取引額。業務上限ではなく技術上の30桁表現範囲
      examples:
      - '1500'
      - '9007199254740993'
    Version:
      type: string
      pattern: ^[1-9][0-9]*$
      description: 正の整数版。DB bigint等から精度を失わず文字列化する案
    Wallet:
      type: object
      additionalProperties: false
      required:
      - wallet_id
      - event_id
      - currency
      - available_amount
      - held_amount
      - refund_only_amount
      - version
      - checked_at
      properties:
        wallet_id:
          $ref: '#/components/schemas/ResourceId'
        event_id:
          $ref: '#/components/schemas/ResourceId'
        currency:
          type: string
          const: JPY
        available_amount:
          $ref: '#/components/schemas/Money'
        held_amount:
          $ref: '#/components/schemas/Money'
        refund_only_amount:
          $ref: '#/components/schemas/Money'
        version:
          $ref: '#/components/schemas/Version'
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
      examples:
      - wallet_id: 22222222-2222-4222-8222-222222222222
        event_id: 33333333-3333-4333-8333-333333333333
        currency: JPY
        available_amount: '9007199254740993'
        held_amount: '500'
        refund_only_amount: '100'
        version: '2'
        checked_at: '2026-10-09T00:00:00Z'
    Transaction:
      type: object
      additionalProperties: false
      required:
      - transaction_id
      - event_id
      - type
      - status
      - amount
      - currency
      - occurred_at
      properties:
        transaction_id:
          $ref: '#/components/schemas/ResourceId'
        event_id:
          $ref: '#/components/schemas/ResourceId'
        type:
          type: string
          enum:
          - CHARGE
          - PAYMENT
          - TRANSFER
          - CASH_REFUND_HOLD
          - CASH_REFUND_RELEASE
          - CASH_REFUND_PAID
          - PURCHASE_REFUND
          - CHARGE_REVERSAL
          - CASH_REFUND_CORRECTION
          - EXPIRATION
          description: API案の語彙。DB勘定/詳細設計の物理enumとのマッピングをDB担当とレビュー
        status:
          type: string
          const: SUCCEEDED
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        currency:
          type: string
          const: JPY
        occurred_at:
          $ref: '#/components/schemas/UtcDateTime'
        source_transaction_id:
          $ref: '#/components/schemas/ResourceId'
          description: 返金/訂正等で参照する元取引。親event一致と現在の照会権限を検証する
    TransactionPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      - checked_at
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Transaction'
        next_cursor:
          type:
          - string
          - 'null'
          minLength: 1
          description: 終端はnull
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
    RequestResult:
      oneOf:
      - $ref: '#/components/schemas/SucceededResult'
      - $ref: '#/components/schemas/RejectedResult'
      - $ref: '#/components/schemas/UnresolvedResult'
    SucceededResult:
      type: object
      additionalProperties: false
      required:
      - status
      - checked_at
      properties:
        status:
          type: string
          const: SUCCEEDED
        transaction:
          $ref: '#/components/schemas/Transaction'
        resource:
          oneOf:
          - $ref: '#/components/schemas/CashRefund'
          - $ref: '#/components/schemas/PurchaseRefund'
          - $ref: '#/components/schemas/CommandReference'
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
      oneOf:
      - required:
        - transaction
        properties:
          transaction: {}
      - required:
        - resource
        properties:
          resource: {}
      description: 元コマンドの効果が永続成立。resourceの現在状態を返す。PREPARED/REQUESTED等は返金/現金交付完了ではない
    RejectedResult:
      type: object
      additionalProperties: false
      required:
      - status
      - rejection
      - checked_at
      properties:
        status:
          type: string
          const: REJECTED
        rejection:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              type: string
              minLength: 1
              description: 永続的最終拒否の業務コード。語彙は更新契約で定義
            message:
              type: string
              minLength: 1
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
    UnresolvedResult:
      type: object
      additionalProperties: false
      required:
      - status
      - checked_at
      properties:
        status:
          type: string
          enum:
          - PENDING
          - UNKNOWN
        checked_at:
          $ref: '#/components/schemas/UtcDateTime'
      examples:
      - status: UNKNOWN
        checked_at: '2026-10-09T00:00:00Z'
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - request_id
      - retryable
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
          description: 調査用識別子。業務取引IDや冪等キーと区別する
        retryable:
          type: boolean
          description: 同じ要求を再試行できるか。新キーでの金銭再処理を許可しない
        current_state_or_query:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            resource_id:
              $ref: '#/components/schemas/ResourceId'
            status:
              type: string
            query_path:
              type: string
              pattern: ^/v1/
              description: 許可された相対GET照会パス。秘密キー・tokenは含めない
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/UnresolvedItem'
          minItems: 0
          maxItems: 100
    ResourceChanged:
      type: object
      additionalProperties: false
      required:
      - resource_type
      - resource_id
      properties:
        resource_type:
          type: string
          enum:
          - wallet
          - transaction
          - payment_request
          - order
          - cash_refund
          - purchase_refund
          - charge
          - transfer_request
          - cash_case
          - cash_reconciliation
          - product
          - inventory
          - cart
          - settings
          - shop
          - grant
          - export
          - order_cancellation
          - event
          - expiration_run
        resource_id:
          $ref: '#/components/schemas/ResourceId'
        version:
          $ref: '#/components/schemas/Version'
      if:
        properties:
          resource_type:
            enum:
            - wallet
            - payment_request
            - order
            - cash_refund
            - purchase_refund
            - charge
            - transfer_request
            - cash_case
            - cash_reconciliation
            - product
            - inventory
            - cart
            - settings
            - shop
            - grant
            - export
            - order_cancellation
            - event
            - expiration_run
      then:
        properties:
          version:
            $ref: '#/components/schemas/Version'
        required:
        - version
    ResyncNotice:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          enum:
          - CURSOR_UNAVAILABLE
          - RECONNECT_REQUIRED
    Reason:
      type: string
      minLength: 1
      maxLength: 1000
      pattern: \S
      description: 理由。長さは補完案。空白のみは拒否し、通常ログへ全文を出さない
    PrepareCashRefund:
      type: object
      additionalProperties: false
      required:
      - identity_token
      - amount
      - balance_source
      properties:
        identity_token:
          type: string
          minLength: 1
          writeOnly: true
          description: 受付用60秒QRの不透明token。用途/event/subject/期限をサーバー照合。生値を保存・通常ログ出力しない
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        balance_source:
          type: string
          enum:
          - AVAILABLE
          - REFUND_ONLY
    ApproveCashRefund:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - amount
      - balance_source
      - approved
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        balance_source:
          type: string
          enum:
          - AVAILABLE
          - REFUND_ONLY
        approved:
          type: boolean
          const: true
    CashRefundVersionInput:
      type: object
      additionalProperties: false
      required:
      - expected_version
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
    CompleteCashRefundPaid:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - outcome
      - cash_delivered_confirmed
      properties:
        expected_version:
          $ref: '#/components/schemas/Version'
        outcome:
          type: string
          const: PAID
        cash_delivered_confirmed:
          type: boolean
          const: true
        resolution_case_id:
          $ref: '#/components/schemas/ResourceId'
    CompleteCashRefundCancelled:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - outcome
      - cash_not_delivered_confirmed
      - reason
