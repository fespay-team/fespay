          type: boolean
          const: true
      allOf:
      - if:
          properties:
            status:
              const: SUCCEEDED
          required:
          - status
        then:
          properties:
            transaction_id: {}
            cash_received_confirmed: {}
          required:
          - transaction_id
          - cash_received_confirmed
      - if:
          properties:
            status:
              const: INVESTIGATING
          required:
          - status
        then:
          properties:
            case_id: {}
          required:
          - case_id
      - if:
          properties:
            status:
              const: PREPARED
          required:
          - status
        then:
          not:
            anyOf:
            - required:
              - transaction_id
              properties:
