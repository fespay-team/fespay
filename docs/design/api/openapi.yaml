      description: codeをサーバー交換し、署名/JWKS・iss・aud・exp・nonce・sub・必要なemail_verifiedを検証。ログインは既存subで特定し、同メールの別identityを暗黙統合しない。LINKはverified_flow_idのみ生成し本人の連携承認へ戻す。stateは成功失敗とも再使用不可。callbackはCSRFヘッダーの代わりに保存stateとセッション束縛を検証。戻り先は許可相対パス。エラー値・code・stateは通常ログに記録しない。
      x-api-ids:
