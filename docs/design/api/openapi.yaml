        REFUND_LIMIT_EXCEEDEDで一円も部分成立させない。通常支払期間内かつ残高有効ならAVAILABLE、販売終了/失効後ならREFUND_ONLYへサーバー判定で加算。通常払戻しOFFを理由に拒否しない。緊急停止下の価値移動は主催者の精算専用再開後のみ。売上減算/返金明細/別取引/台帳/監査/Outboxを同一Tx。元決済不変、在庫は自動復元しない。技術障害は503/202で元申出を保持し、未成立が確定した業務拒否だけREJECTEDを永続化する。金額等の申出変更は禁止。
