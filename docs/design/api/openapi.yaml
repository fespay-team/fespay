          properties:
            cash_returned_confirmed: {}
        then:
          properties:
            status:
              type: string
              const: CANCELLED
            cash_received_confirmed:
              type: boolean
              const: true
          required:
          - cash_received_confirmed
      - if:
          properties:
            status:
