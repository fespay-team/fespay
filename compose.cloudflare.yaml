# Optional dedicated connector; keep existing home-server tunnels unchanged.
services:
  tunnel:
    image: cloudflare/cloudflared:2026.7.1@sha256:188bb03589a32affed3cf4d0590565ffe67b78866e6b5582574afab2b705bafe
    command: [tunnel, --config, /etc/cloudflared/config.yml, run]
    user: ${FESPAY_TUNNEL_UID:?Set the secret file owner UID}:${FESPAY_TUNNEL_GID:?Set the secret file owner GID}
    volumes:
      - ./secrets/cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ./secrets/cloudflared.json:/run/secrets/tunnel.json:ro
    networks: [frontend]
    depends_on:
      gateway: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
